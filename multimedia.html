<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a>Seccion 1: Marcos e Integracion Externa (iframe, embed y object)</a>
        <ol type="1">
            <li></li><iframe width="560" height="315" src="https://www.youtube.com/embed/EvKm8yhM7V8?si=3H8XLaRIniowQUf7" title="Video tutorial de HTML5" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></li>
            <li><embed src="media/apuntes.pdf" type="application/pdf" width="100%" height="500px"></li>
            <li><object type="text/html" data="https://www.wikipedia.org" width="300" height="200">Tu navegador no admite la visualizacion de este objeto incrustado</object></li>
        </ol>
    <a>Seccion 2: Reproductores Multimedia Nativos</a>
        <ol type="1">
            <li>
                <video width="640" controls source src="media/muestra.mp4" type="video/mp4">
                <source src="media/muestra.mp4" type="video/mp4">
                <source poster="/media/portada.jpg" type="image/jpg">
                EL NAVEGADOR NO SOPORTA REPRODUCCION MULTIMEDIA
            </video>
            </li>
            <li>
                <audio controls>
                <source src="media/pista.mp3" type="audio/mpeg">
                <source src="media.pista.ogg" type="audio/ogg">
                El navegador no soporta elementos de audio
                </audio>
            </li>
        </ol>
    <a>Seccion 3: Graficos Vectoriales y Mapa de Bits "(svg y canvas)"</a>
        <ol>
            <li>
                <svg width="200" height="200">
                <rect width="200" height="100" x="10" y="10" rx="20" ry="20" fill="blue" />
                <circle cx="50" cy="50" r="40" stroke="red" stroke-width="4" fill="yellow" />
                </svg>
            </li>
            <li>
                <canvas id="miLienzo" width="300" height="150" style="border:1px solid #000000;">
                    
                </canvas>
            </li>
        </ol>
            <script>
                        const canvas = document.getElementById('miLienzo');
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = 'green';
                        ctx.fillRect(10, 10, 150, 80);
                        ctx.moveTo(0, 0);
                        ctx.lineTo(200, 100); 
                        ctx.stroke(); 
            </script>
    </body >
</html>
