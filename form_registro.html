<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/registro.php" method="post">
    <fieldset>
        <p>
          <label for="code">Código de Alumno: </label>
        <input name="code" id="code" type="code" pattern="[A-Z]{3}[0-9]{3}">  
        </p>
        <p>
        <label for="email">Gmail: </label>
        <input name="email" id="email" type="email">
        </p>
        <p>
           <label for="age">Edad: </label>
        <input name="age" id="age" type="number" min="16" max="65">  
        </p>
       <p>
         <label for="number">Telefono: </label>
        <input name="number" id="number" type="number" pattern="[0-9]{9}">    
       </p>
        <p>
         <a href="https://www.google.com/">Visita Google</a>
        <label>Elije una sugerencia: <input list="programs" name="myProgram"/></label>   
        </p>
        <p>
         <datalist id="programs">
            <option value="IntelliJ IDEA"></option>
            <option value="Visual Studio Code"></option>
            <option value="Visual Studio Code"></option>
            <option value="Visual Studio Code"></option>
            </datalist>   
        </p>
        <p>
         <label for="Aceptación de la Política de Privacidad">Aceptación de la Política de Privacidad</label>
        <input type="checkbox" name="Aceptación de la Política de Privacidad" value="Aceptación de la Política de Privacidad" required>   
        </p>  
        <p>
          <input type="reset" name="Resetear" value="Resetear">
          <input type="submit" name="Enviar" value="Enviar">  
        </p>
    </fieldset>
    

    </form>
