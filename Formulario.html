<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="https://www.w3schools.com/action_page.php" method="get">
    <fieldset>
        <legend>Información de contacto</legend>
        <label for="name">Nombre de usuario:</label>
        <input type="text" id="name"><br>
        <label for="password">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña">
        <label for="email">Email:</label>
        <input type="email" id="email"><br>
        <input type="checkbox" id="suscripcion" name="suscripcion" value="aceptar">
        <label for="suscripcion">¿Tienes mascota?</label>
        <input type="radio" id="opcion1" name="opcion" value="opcion1">
        <label for="opcion1">¿Eres hombre?</label><br>
        <input type="radio" id="opcion2" name="opcion" value="opcion2">
        <label for="opcion2">¿Eres mujer?</label>
        <label for="message">Mensaje:</label>
        <textarea id="message"></textarea>
    </fieldset>
<button>Enviar</button>
</form>
</body>
</html>
