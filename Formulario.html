<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form action="https://www.w3schools.com/action_page.php" method="get">
    <fieldset>
        <legend>Información de contacto</legend>
        <label for="name">Nombre de usuario:</label>
        <input type="text" id="name" name="name" placeholder="Nombre">
        <label for="password">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" placeholder="Contraseña">
        <label for="email">Email:</label>
        <input type="email" id="email"><br>
        <p>
            <label for="suscripcion">¿Tienes mascota?</label>
            <input type="checkbox" name="mascota" value="Si">Si
            <input type="checkbox" name="mascota" value="No">No
        </p>
        <p>
            <label>Sexo</label>
            <input type="radio"  name="sexo" value="Hombre">Hombre
            <input type="radio"  name="sexo" value="Mujer">Mujer
            <input type="radio"  name="sexo" value="Prefiero no decirlo">Prefiero no decirlo
        </p>
        <p>
            <label for="numero"></label>
            <input type="number" id="edad" name="edad" min="18" max="999" placeholder="Edad">
        </p>
    <label for="estudios">Estudios: </label>
        <select name="estudios" id="estudios">
            <optgroup label="Estudios Universitarios">
                <option>Doctorado</option>
                <option>Máster</option>
                <option>Grado</option>
            </optgroup>
    <optgroup label="Ciclo Formativo">
                <option>Grado Superior</option>
                <option>Grado Medio</option>
            </optgroup>
        </select><br><br>
        <label for="navegador">Elige tu navegador favorito: </label>
        <input name="navegador" id="navegador" list="browsers">
        <datalist name="browsers" id="browsers">
            <option value="Chrome">
            <option value="Firefox">
            <option value="Brave">
            <option value="Opera">
            <option value="Safari">
            <option value="Microsoft Edge">
        </datalist><br><br>
        <label for="mensaje">Escribe tu mensaje: </label>
        <textarea rows="10" cols="50" placeholder="Mensaje" id="mensaje" name="mensaje" ></textarea>
    </fieldset>
<button type="button" id="Enviar">Enviar</button>
</form>
</body>
</html>
